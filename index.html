<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股 Sell Put 期權收益與回撤計算器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [ticker, setTicker] = React.useState('QQQ');
            const [stockPrice, setStockPrice] = React.useState(495.0);
            const [strikePrice, setStrikePrice] = React.useState(485.0);
            const [premium, setPremium] = React.useState(3.50);
            const [contracts, setContracts] = React.useState(1);
            const [dte, setDte] = React.useState(30);

            // 計算核心指標
            const totalPremium = premium * 100 * contracts;
            const capitalRequired = strikePrice * 100 * contracts;
            const absoluteReturn = (totalPremium / capitalRequired) * 100;
            const annualizedReturn = absoluteReturn * (365 / dte);
            const breakEven = strikePrice - premium;
            const downsideCushion = ((stockPrice - strikePrice) / stockPrice) * 100;

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                        <h1 className="text-2xl font-bold text-emerald-400 mb-2">📊 美股 Sell Put 期權收益與安全邊界計算器</h1>
                        <p className="text-slate-400 text-sm mb-6">模擬計算現金擔保賣出看跌期權 (Cash-Secured Put) 的真實回報與風險指標。</p>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">標的代碼 (Ticker)</label>
                                    <input type="text" value={ticker} onChange={(e) => setTicker(e.target.value.toUpperCase())} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white font-bold" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">正股現價 ($)</label>
                                    <input type="number" step="0.5" value={stockPrice} onChange={(e) => setStockPrice(Number(e.target.value))} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">行權價 / 協議價 (Strike) ($)</label>
                                    <input type="number" step="0.5" value={strikePrice} onChange={(e) => setStrikePrice(Number(e.target.value))} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">期權權利金 / 權金 (Premium) ($)</label>
                                    <input type="number" step="0.1" value={premium} onChange={(e) => setPremium(Number(e.target.value))} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">合約張數 (Contracts)</label>
                                        <input type="number" min="1" value={contracts} onChange={(e) => setContracts(Number(e.target.value))} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">到期天數 (DTE)</label>
                                        <input type="number" min="1" value={dte} onChange={(e) => setDte(Number(e.target.value))} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 flex flex-col justify-between space-y-4">
                                <h3 className="text-sm font-semibold text-emerald-400 uppercase tracking-wider">核心收益與風險解構</h3>
                                <div className="space-y-3">
                                    <div className="flex justify-between border-b border-slate-900 pb-2">
                                        <span className="text-slate-400 text-sm">總權利金收入:</span>
                                        <span className="text-emerald-400 font-bold text-lg">${totalPremium.toFixed(2)} USD</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-900 pb-2">
                                        <span className="text-slate-400 text-sm">佔用保證金 (接股成本):</span>
                                        <span className="text-white font-medium">${capitalRequired.toLocaleString()} USD</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-900 pb-2">
                                        <span className="text-slate-400 text-sm">到期絕對收益率 (ROI):</span>
                                        <span className="text-cyan-400 font-bold">{absoluteReturn.toFixed(2)}%</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-900 pb-2">
                                        <span className="text-slate-400 text-sm">年化收益率 (Annualized):</span>
                                        <span className="text-amber-400 font-bold text-lg">{annualizedReturn.toFixed(2)}%</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-900 pb-2">
                                        <span className="text-slate-400 text-sm">損益平衡點 (Break-even):</span>
                                        <span className="text-white font-medium">${breakEven.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-slate-400 text-sm">現價安全邊界 (Cushion):</span>
                                        <span className={`font-bold ${downsideCushion >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{downsideCushion.toFixed(2)}%</span>
                                    </div>
                                </div>
                                <div className="text-xs text-slate-500 pt-2 border-t border-slate-900">
                                    💡 提示：若到期時股價大於行權價 (${strikePrice})，你將安全賺取全部權利金；若低於行權價，則需按合約價履行接股義務。
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
